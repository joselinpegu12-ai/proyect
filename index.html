<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Frases Serverless</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 380px; text-align: center; border: 1px solid #334155; }
    h2 { color: #38bdf8; margin-top: 0; }
    p.quote { font-size: 1.25em; font-style: italic; color: #e2e8f0; margin: 20px 0 10px 0; min-height: 80px; display: flex; align-items: center; justify-content: center; }
    p.author { font-weight: bold; color: #94a3b8; margin-bottom: 25px; }
    button { padding: 12px 24px; border: none; background-color: #38bdf8; color: #0f172a; font-weight: bold; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
    button:hover { background-color: #0284c7; color: white; }
    .footer { margin-top: 15px; font-size: 0.8em; color: #64748b; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Frase del Día</h2>
    <p id="frase" class="quote">Presiona el botón para obtener una frase inspiradora...</p>
    <p id="autor" class="author"></p>
    <button onclick="obtenerFrase()">Generar Frase</button>
    <div class="footer">Backend: Node.js Serverless via Vercel</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
